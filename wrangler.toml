
# Cloudflare Pages configuration for local preview with Wrangler.
#
# Usage:
#   pnpm build
#   npx wrangler pages dev dist
#
# This file is optional — Cloudflare Pages auto-detects Astro when you
# connect your GitHub repo via the dashboard. Use this only for local
# preview or `wrangler pages deploy`.
#
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "moriohhigh-wiki"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Site (must include https:// protocol — Astro validates this as a URL)
# Verified active custom domain for the Cloudflare Pages project.
SITE_URL = "https://moriohhighguide.wiki"
# Legacy IndexNow override — new forks generate .indexnow-key automatically.
# Leave blank unless migrating an existing env-backed deployment.
#INDEXNOW_KEY = ""
# Giscus comments — blank = comments disabled until you fill your own values.
# See docs/comments.md for how to get these from giscus.app.
PUBLIC_GISCUS_REPO = ""
PUBLIC_GISCUS_REPO_ID = ""
PUBLIC_GISCUS_CATEGORY = ""
PUBLIC_GISCUS_CATEGORY_ID = ""
PUBLIC_GISCUS_MAPPING = "pathname"
# Sponsor card — blank = disabled. Fill PUBLIC_SPONSOR_URL to enable.
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
# Cloudflare Web Analytics — blank = disabled.
PUBLIC_CF_BEACON_TOKEN = ""
# Optional slots (empty = disabled) — fill HERE, not the dashboard:
#PUBLIC_ADSENSE_CLIENT = ""
#PUBLIC_ADSENSE_SLOT_STICKY = ""
#PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
#PUBLIC_ADSENSE_SLOT_INCONTENT = ""
# Adsterra — for each slot you enable, also create public/ads/<name>.html with
# the snippet from the Adsterra dashboard (pattern: docs/ads.md 「广告位怎么挂」).
PUBLIC_ADSTERRA_SLOT_SIDEBAR_300X250 = "c58743771bdc97b3082f742144fe40e6"
PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90 = "cecc4e92c4a907a61a188f217b4f257c"
PUBLIC_ADSTERRA_SLOT_INCONTENT_468X60 = "8dc82d33890a8a6a2e6a6fb397304ac8"
PUBLIC_ADSTERRA_SLOT_NATIVE_BANNER = "482de39ee08a1ab07ba7caedb81ef64a"
PUBLIC_ADSTERRA_SLOT_STICKY_320X50 = "675ccec8e54c1b36c848ecb6e4db910b"
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X300 = "5e45cd597843747f06314ae2dd298dd4"
PUBLIC_ADSTERRA_SLOT_SIDEBAR_160X600 = "7c62e4984014b65ba6d95223388dd148"
# Native consent-gated analytics for this independent site's web stream.
PUBLIC_GA_ID = "G-MLLG5CEMCG"
# Public verification identifier for this site's URL-prefix property.
PUBLIC_GSC_VERIFICATION = "85vq2SGiZSnqZuqjZ8DzIoT_aqdAvxX21XsZIJmGzdg"
